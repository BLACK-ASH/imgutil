[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "imgutil"
version = "0.2.0"
description = "Multi-utility image processing: background removal, upscaling, deblurring, enhancement"
requires-python = ">=3.10"
dependencies = [
    "rembg[gpu]",
    "Pillow",
    "click",
    "realesrgan",
    "basicsr",
    "gfpgan",
    "opencv-python",
]

[project.scripts]
imgutil = "imgutil.cli:main"
remove-bg = "imgutil.remove:main"

[tool.setuptools.packages.find]
include = ["imgutil*"]
